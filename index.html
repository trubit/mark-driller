<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mark Driller — Drill down. Hit the mark.</title>
  <meta name="description" content="Study materials, past questions and full CBT simulations for WAEC, NECO, JAMB/UTME and university exams — built for secondary and university students across West Africa.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#c2410c">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
      function syncServiceWorker() {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) {
            regs[i].update().catch(function() {});
          }
        }).catch(function() {});

        navigator.serviceWorker.register('/sw.js', { scope: '/' }).then(function(reg) {
          reg.update().catch(function() {});
        }).catch(function(err) {
          console.warn('[SW Registration Notice]', err);
        });
      }

      if (document.readyState === 'complete' || document.readyState === 'interactive') {
        syncServiceWorker();
      } else {
        window.addEventListener('DOMContentLoaded', syncServiceWorker);
        window.addEventListener('load', syncServiceWorker);
      }
    }
  </script>
</body>
</html>
