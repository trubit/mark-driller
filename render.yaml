# ==============================================================================
# MarkDriller 100% Free Tier Render Blueprint ($0 / month — No Credit Card)
# Documentation: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  - type: web
    name: markdriller
    runtime: node
    plan: free # 100% Free tier ($0 / month — No payment required)
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: PORT
        value: 10000

      # Database Connection
      - key: MONGODB_URI
        sync: false

      # Application & Domain Routing
      - key: APP_URL
        value: https://markdriller.com
      - key: CLIENT_URL
        value: https://markdriller.com
      - key: CORS_ORIGIN
        value: https://markdriller.com
      - key: ADMIN_EMAIL
        value: admin@markdriller.com

      # Auto-Generated Cryptographic Keys (No manual input needed)
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true

      # Payment Gateway Configuration (Paystack Live)
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false

      # Cloudinary Storage for Study Materials & Syllabi
      - key: STORAGE_PROVIDER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: markdriller/materials

      # Transactional Email (Brevo)
      - key: EMAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: '"MarkDriller" <oliversmith2140@gmail.com>'
      - key: QUESTION_SYNC_ENABLED
        value: "false"
