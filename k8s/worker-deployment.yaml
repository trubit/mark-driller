apiVersion: apps/v1
kind: Deployment
metadata:
  name: markdriller-worker
  namespace: markdriller
  labels:
    app.kubernetes.io/name: markdriller
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: markdriller
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: markdriller
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: markdriller-sa
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: markdriller-worker
          image: markdriller/api:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/server/worker.js"]

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          envFrom:
            - configMapRef:
                name: markdriller-config
            - secretRef:
                name: markdriller-secrets

          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp

      volumes:
        - name: tmp-volume
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
