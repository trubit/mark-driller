      .outer-ring { stroke: #fdfbf7; }
      .crosshairs { stroke: #fdfbf7; }
      .dot { fill: #fdfbf7; }
      .inner-ring { stroke: #e07a48; }
    }
  </style>
  <circle class="outer-ring" cx="16" cy="16" r="13" stroke-width="2.2" />
  <circle class="inner-ring" cx="16" cy="16" r="7.5" stroke-width="2.4" />
  <circle class="dot" cx="16" cy="16" r="2.2" />
  <line class="crosshairs" x1="16" y1="0" x2="16" y2="6" stroke-width="2.2" stroke-linecap="round" />
  <line class="crosshairs" x1="16" y1="26" x2="16" y2="32" stroke-width="2.2" stroke-linecap="round" />
  <line class="crosshairs" x1="0" y1="16" x2="6" y2="16" stroke-width="2.2" stroke-linecap="round" />
  <line class="crosshairs" x1="26" y1="16" x2="32" y2="16" stroke-width="2.2" stroke-linecap="round" />
</svg>
