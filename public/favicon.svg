<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <style>
    .outer-ring { stroke: #14181c; }
    .crosshairs { stroke: #14181c; }
    .dot { fill: #14181c; }
    .inner-ring { stroke: #a8562f; }
