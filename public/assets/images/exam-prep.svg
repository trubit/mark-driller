<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="epBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="60%" stop-color="#1C2541"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="epBrand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="epCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#epBg)"/>

  <!-- Academic Grid Pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Central Exam Card Graphic -->
  <g transform="translate(100, 60)">
    <rect width="600" height="380" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

    <!-- Header bar -->
    <rect width="600" height="48" rx="14" fill="#1e293b"/>
    <circle cx="28" cy="24" r="5" fill="#ef4444"/>
    <circle cx="44" cy="24" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="24" r="5" fill="#10b981"/>
    <text x="84" y="30" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="13">MarkDriller Official Examination Simulator</text>

    <!-- Content Mockup -->
    <g transform="translate(32, 74)">
      <rect width="536" height="56" rx="8" fill="#1e293b"/>
      <text x="18" y="26" fill="#ea580c" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="11">ACCREDITED BOARD CURRICULUM</text>
      <text x="18" y="45" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="14">JAMB / UTME • WAEC • NECO • GCE • POST-UTME</text>

      <rect y="72" width="256" height="110" rx="8" fill="#132038" stroke="#1e3a8a" stroke-width="1"/>
      <text x="16" y="98" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="12">PRACTICE &amp; STUDY MODES</text>
      <text x="16" y="122" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Instant worked solutions,</text>
      <text x="16" y="140" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">step-by-step curriculum notes,</text>
      <text x="16" y="158" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">and bookmark review.</text>

      <rect x="280" y="72" width="256" height="110" rx="8" fill="#2a1208" stroke="#9a3412" stroke-width="1"/>
      <text x="296" y="98" fill="#fb923c" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="12">TIMED CBT SIMULATION</text>
      <text x="296" y="122" fill="#fed7aa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Authoritative countdown timer,</text>
      <text x="296" y="140" fill="#fed7aa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">server-scored accuracy,</text>
      <text x="296" y="158" fill="#fed7aa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">and topic performance audit.</text>

      <g transform="translate(0, 204)">
        <rect width="536" height="38" rx="8" fill="url(#epBrand)"/>
        <text x="180" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="13">Start CBT Drill &amp; Past Questions →</text>
      </g>
